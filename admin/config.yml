backend:
  name: github
  repo: your-username/your-repo-name # Thay bằng tài khoản và tên kho GitHub của bạn
  branch: main

media_folder: "images/uploads" # Nơi lưu ảnh tải lên
public_folder: "/images/uploads"

collections:
  # Mục quản lý bài viết Blog
  - name: "blog"
    label: "Bài Viết (Blogs)"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Tiêu đề bài viết", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime" }
      - { label: "Ảnh đại diện", name: "thumbnail", widget: "image" }
      - { label: "Mô tả ngắn", name: "description", widget: "text" }
      - { label: "Nội dung bài viết", name: "body", widget: "markdown" }

  # Mục quản lý Mã Giảm Giá (Coupons)
  - name: "coupons"
    label: "Mã Giảm Giá (Coupons)"
    folder: "content/coupons"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Tên thương hiệu (Shopee/Lazada/Tiki...)", name: "store", widget: "string" }
      - { label: "Tiêu đề giảm giá", name: "title", widget: "string" }
      - { label: "Mã Coupon (Code)", name: "coupon_code", widget: "string", required: false }
      - { label: "Link tiếp thị (Affiliate Link)", name: "affiliate_url", widget: "string" }
      - { label: "Mức giảm", name: "discount_value", widget: "string" }
      - { label: "Ngày hết hạn", name: "expiry_date", widget: "datetime", required: false }