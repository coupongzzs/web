backend:
  name: github
  repo: coupongzzs/web
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # Blog Posts Management
  - name: "blog"
    label: "Blog Posts & Guides"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Coupons", "Reviews", "Tips & Tricks", "Flash Sales"] }
      - { label: "Store Name", name: "store_name", widget: "string" }
      - { label: "Voucher Code", name: "voucher_code", widget: "string", required: false }
      - { label: "Affiliate Link", name: "affiliate_url", widget: "string" }
      - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
      - { label: "Short Summary", name: "summary", widget: "text" }
      - { label: "Article Body", name: "body", widget: "markdown" }

  # Coupons Management
  - name: "coupons"
    label: "Promo Codes & Deals"
    folder: "content/coupons"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Store Name", name: "store", widget: "string" }
      - { label: "Discount Headline", name: "title", widget: "string" }
      - { label: "Coupon Code", name: "code", widget: "string", required: false }
      - { label: "Discount Value (e.g. 15% OFF)", name: "discount", widget: "string" }
      - { label: "Affiliate Target URL", name: "url", widget: "string" }
      - { label: "Expiration Date", name: "expiry", widget: "datetime", required: false }
